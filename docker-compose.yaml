version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    # image: quay.io/keycloak/keycloak:23.0
    restart: unless-stopped
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: yisheng
      KEYCLOAK_ADMIN_PASSWORD: Yisheng@1028
    ports:
      - "8080:8080"
    command:
      - start-dev