<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統儀表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .user-info {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .user-info h3 {
            color: #2e7d32;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .user-info p {
            color: #1b5e20;
            font-size: 14px;
            margin: 8px 0;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .subsystems h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .subsystem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .subsystem-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .subsystem-card:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .subsystem-card .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .subsystem-card .name {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏠 系統儀表板</h1>
        </div>

        <div class="error" id="errorMsg"></div>

        <div class="user-info" id="userInfo">
            <h3>👤 使用者資訊</h3>
            <p id="userName"></p>
            <p id="userEmail"></p>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>

        <div class="subsystems">
            <h3>📱 可用系統</h3>
            <div id="loading" class="loading" style="display:none;">載入中...</div>
            <div class="subsystem-grid" id="subsystemGrid"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://172.27.207.106:8001';

        // 頁面載入時檢查登入狀態
        window.onload = function() {
            checkLoginStatus();
        };

        // 檢查登入狀態
        function checkLoginStatus() {
            const token = localStorage.getItem('access_token');
            const user = localStorage.getItem('user');

            if (!token || !user) {
                // 未登入，導回登入頁
                window.location.href = '/login.html';
                return;
            }

            const userData = JSON.parse(user);
            displayUserInfo(userData);
            loadSubsystems();
        }

        // 顯示使用者資訊
        function displayUserInfo(user) {
            document.getElementById('userName').textContent = `使用者：${user.username}`;
            document.getElementById('userEmail').textContent = `Email：${user.email || '未設定'}`;
        }

        // 載入子系統列表
        async function loadSubsystems() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('subsystemGrid');
            
            loading.style.display = 'block';
            grid.innerHTML = '';

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${API_BASE_URL}/api/subsystems/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('無法載入子系統列表');
                }

                const subsystems = await response.json();
                displaySubsystems(subsystems);

            } catch (error) {
                showError('載入子系統失敗：' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // 顯示子系統卡片
        function displaySubsystems(subsystems) {
            const grid = document.getElementById('subsystemGrid');

            if (subsystems.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;">暫無可用系統</p>';
                return;
            }

            subsystems.forEach(system => {
                const card = document.createElement('div');
                card.className = 'subsystem-card';
                card.onclick = () => navigateToSubsystem(system);
                
                card.innerHTML = `
                    <div class="icon">${system.icon || '📦'}</div>
                    <div class="name">${system.name}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        // 導向子系統
        function navigateToSubsystem(system) {
            const token = localStorage.getItem('access_token');
            
            // 將 token 透過 URL 參數傳給子系統
            const url = `${system.url}?sso_token=${encodeURIComponent(token)}`;
            
            // 在新分頁開啟子系統
            window.open(url, '_blank');
        }

        // 登出
        async function logout() {
            const token = localStorage.getItem('access_token');
            
            try {
                // 呼叫後端登出 API（可選）
                await fetch(`${API_BASE_URL}/api/auth/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
            } catch (error) {
                console.error('登出 API 呼叫失敗', error);
            }
            
            // 清除本地儲存
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            
            // 導回登入頁
            window.location.href = '/login.html';
        }

        // 顯示錯誤訊息
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
